name: Windows Build Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'electron/**'
      - 'scripts/**'
      - 'electron-builder.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tests/unit/gateway-runtime-compatibility.test.ts'
      - 'scripts/smoke-packaged-gateway.mjs'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate extension bridge
        run: pnpm run ext:bridge
      - name: Verify source
        run: pnpm run verify:release

  windows-build:
    needs: verify-source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package unsigned Windows installer
        run: pnpm run package:win
      - name: Smoke-test packaged OpenClaw gateway
        run: node scripts/smoke-packaged-gateway.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installer
          path: release/*.exe
          if-no-files-found: error
