name: Total Automation Baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          cache: pnpm
      - name: Reject whitespace errors
        run: git show --check --oneline --format='%h %s' HEAD
      - name: Reject unresolved merge markers
        shell: bash
        run: |
          if git grep -nE '^(<{7}|={7}|>{7})( |$)' -- ':!pnpm-lock.yaml'; then exit 1; fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:carry-forward
      - name: Verify release governance files
        run: |
          test -s .github/AUTOMATION_POLICY.md
          test -s docs/CARRY_FORWARD.md
          test -s RELEASE_NOTES_v1.0.0.md
          test -s SECURITY.md
