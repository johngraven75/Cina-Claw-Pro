name: Release Windows

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'RELEASE_NOTES_v*.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: windows-release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify-source:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: pnpm
      - name: Verify tag and package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" == "main" ]]; then
            RELEASE_TAG="v$package_version"
            echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          fi
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi
          node scripts/assert-tag-matches-package.mjs
      - name: Restore dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate extension bridge
        run: pnpm run ext:bridge
      - name: Verify release source
        run: pnpm run verify:release
      - name: Validate repository harness
        run: pnpm run harness:ci

  package-windows:
    needs: verify-source
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          # Node 23+ can abort on Windows during fetch() cleanup with
          # 0xC0000409; packaging uses the app's supported Node 22 runtime.
          node-version: '22.22.3'
          cache: pnpm
      - name: Verify tag and package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -eq "main") {
            $env:RELEASE_TAG = "v$packageVersion"
            "RELEASE_TAG=$env:RELEASE_TAG" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }
          if ($env:RELEASE_TAG -ne "v$packageVersion") { throw "Release tag $env:RELEASE_TAG does not match package version $packageVersion" }
          node scripts/assert-tag-matches-package.mjs
      - name: Restore dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate extension bridge
        run: pnpm run ext:bridge
      - name: Package Windows installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run package:win
      - name: Smoke-test packaged OpenClaw gateway
        run: node scripts/smoke-packaged-gateway.mjs
      - name: Create SHA-256 manifest
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File | Where-Object { $_.Name -ne 'builder-debug.yml' -and ($_.Extension -in '.exe', '.blockmap', '.yml') } | Sort-Object Name
          if (-not ($files | Where-Object Extension -eq '.exe')) { throw 'No Windows installer was produced.' }
          $lines = foreach ($file in $files) { $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $($file.Name)" }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cina-Claw-Pro-${{ env.RELEASE_TAG }}-Windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/SHA256SUMS.txt
            !release/builder-debug.yml
          if-no-files-found: error
          retention-days: 30
      - name: Publish or refresh GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(release/*.exe release/*.blockmap release/latest*.yml release/SHA256SUMS.txt)
          notes_file="RELEASE_NOTES_${RELEASE_TAG}.md"
          if [[ ! -f "$notes_file" ]]; then
            echo "Release notes not found: $notes_file" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --notes-file "$notes_file" --title "Cina-Claw Pro ${RELEASE_TAG#v}"
          else
            if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "Cina-Claw Pro ${RELEASE_TAG#v}" --notes-file "$notes_file"
            else
              gh release create "$RELEASE_TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "Cina-Claw Pro ${RELEASE_TAG#v}" --notes-file "$notes_file"
            fi
          fi
