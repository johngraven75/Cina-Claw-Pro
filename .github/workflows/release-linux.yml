name: Release Linux

# Debian/Zorin Linux release, manual only: builds the x64 .deb for an
# existing version tag (for example v1.0.9) and uploads it to that tag's
# GitHub release. The main release workflow is Windows-only, so this
# workflow exists separately rather than changing its behaviour.
# Zorin OS is Ubuntu-based, so the Ubuntu-built .deb is the right
# package for both Debian and Zorin (x64 only; arm64/AppImage/rpm are
# not built here).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v1.0.9'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: linux-release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  package-linux:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          cache: pnpm
      - name: Verify tag and package version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi
          node scripts/assert-tag-matches-package.mjs
      - name: Restore dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate extension bridge
        run: pnpm run ext:bridge
      - name: Download Linux bundled binaries
        run: |
          pnpm run uv:download:linux
          pnpm run agent-browser:download:linux
      - name: Package Linux .deb (x64)
        run: |
          pnpm run package
          node scripts/run-electron-builder.mjs --linux deb --x64 --publish never
      - name: Check .deb was produced
        run: |
          ls -lh release/
          if ! ls release/*.deb >/dev/null 2>&1; then
            echo 'No Linux .deb was produced.' >&2
            exit 1
          fi
      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Cina-Claw-Pro-${{ env.RELEASE_TAG }}-Linux
          path: release/*.deb
          if-no-files-found: error
          retention-days: 30
      - name: Publish .deb to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(release/*.deb)
          # Extend the release's SHA256SUMS.txt with the .deb hash,
          # preserving the existing (Windows) entries. Fail loudly if
          # the existing manifest cannot be downloaded, instead of
          # silently replacing it with a .deb-only manifest.
          if ! gh release download "$RELEASE_TAG" --pattern 'SHA256SUMS.txt' --dir release --clobber; then
            echo 'Could not download existing SHA256SUMS.txt; refusing to overwrite it.' >&2
            exit 1
          fi
          for file in "${assets[@]}"; do
            hash="$(sha256sum "$file" | awk '{print $1}')"
            name="$(basename "$file")"
            grep -v "  $name\$" release/SHA256SUMS.txt > release/SHA256SUMS.txt.tmp || true
            mv release/SHA256SUMS.txt.tmp release/SHA256SUMS.txt
            echo "$hash  $name" >> release/SHA256SUMS.txt
          done
          sort -o release/SHA256SUMS.txt release/SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" "${assets[@]}" release/SHA256SUMS.txt --clobber
